# Shared middlewares available to all stacks as <name>@file
http:
  middlewares:
    # Restrict admin surfaces (Traefik dashboard, OpenObserve UI,
    # RabbitMQ UI, MinIO console) to Cloudflare's edge network.
    #
    # NOTE: these domains are proxied through Cloudflare, so Traefik sees
    # Cloudflare edge IPs, not the real client. This allowlist only blocks
    # direct-to-origin bypass. It is NOT authentication by itself — put
    # Cloudflare Access (Zero Trust) in front of these hosts for the real gate.
    #
    # Source: https://www.cloudflare.com/ips/ (keep in sync periodically).
    admin-allowlist:
      ipAllowList:
        # Traefik reads the connecting IP; behind CF proxy that is a CF edge IP.
        sourceRange:
          # Cloudflare IPv4
          - "173.245.48.0/20"
          - "103.21.244.0/22"
          - "103.22.200.0/22"
          - "103.31.4.0/22"
          - "141.101.64.0/18"
          - "108.162.192.0/18"
          - "190.93.240.0/20"
          - "188.114.96.0/20"
          - "197.234.240.0/22"
          - "198.41.128.0/17"
          - "162.158.0.0/15"
          - "104.16.0.0/13"
          - "104.24.0.0/14"
          - "172.64.0.0/13"
          - "131.0.72.0/22"
          # Cloudflare IPv6
          - "2400:cb00::/32"
          - "2606:4700::/32"
          - "2803:f800::/32"
          - "2405:b500::/32"
          - "2405:8100::/32"
          - "2a06:98c0::/29"
          - "2c0f:f248::/32"

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin

    api-ratelimit:
      rateLimit:
        average: 50
        burst: 100
